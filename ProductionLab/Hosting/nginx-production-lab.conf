upstream production_lab {
    server 127.0.0.1:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name production-lab.example.com;

    location / {
        proxy_pass http://production_lab;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# In production, replace the HTTP server with a 443 server using a managed
# certificate and redirect port 80 to HTTPS. Keep the application bound to
# loopback so the reverse proxy remains the public entry point.
